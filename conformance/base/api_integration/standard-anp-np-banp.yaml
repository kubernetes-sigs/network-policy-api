apiVersion: policy.networking.k8s.io/v1beta1
kind: ClusterNetworkPolicy
metadata:
  name: pass-example
spec:
  tier: Admin
  priority: 10
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          conformance-house: gryffindor
      podSelector:
        matchLabels:
          conformance-house: gryffindor
  ingress:
  # 'conformance-role: delegated' is set by the test on draco-malfoy-0.
  - name: "deny-ingress-from-delegated-slytherin-pods" # test will update to pass
    action: "Deny" # test will update to pass
    from:
    - pods:
        namespaceSelector:
          matchLabels:
            conformance-house: slytherin
        podSelector:
          matchLabels:
            conformance-role: delegated
  # Only reached by the slytherin pods that the rule above does not select (draco-malfoy-1).
  - name: "accept-all-ingress-from-slytherin"
    action: "Accept"
    from:
    - pods:
        namespaceSelector:
          matchLabels:
            conformance-house: slytherin
        podSelector:
          matchLabels:
            conformance-house: slytherin
  egress:
  # 'conformance-role: delegated' is set by the test on draco-malfoy-0.
  - name: "deny-egress-to-delegated-slytherin-pods" # test will update to pass
    action: "Deny" # test will update to pass
    to:
    - pods:
        namespaceSelector:
          matchLabels:
            conformance-house: slytherin
        podSelector:
          matchLabels:
            conformance-role: delegated
  # Only reached by the slytherin pods that the rule above does not select (draco-malfoy-1).
  - name: "accept-all-egress-to-slytherin"
    action: "Accept"
    to:
    - pods:
        namespaceSelector:
          matchLabels:
            conformance-house: slytherin
        podSelector:
          matchLabels:
            conformance-house: slytherin
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gress-from-to-slytherin-to-gryffindor
  namespace: network-policy-conformance-gryffindor
spec:
  # 'conformance-role: isolated' is set by the test on harry-potter-0, so no network policy selects harry-potter-1.
  podSelector:
    matchLabels:
      conformance-role: isolated
  policyTypes:
    - Ingress
    - Egress
  # Only TCP port 80 is allowed, so the selected pod is isolated from slytherin on every other port.
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          conformance-house: slytherin
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          conformance-house: slytherin
    ports:
    - protocol: TCP
      port: 80
---
apiVersion: policy.networking.k8s.io/v1beta1
kind: ClusterNetworkPolicy
metadata:
  name: default
spec:
  tier: Baseline
  priority: 10
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          conformance-house: gryffindor
      podSelector:
        matchLabels:
          conformance-house: gryffindor
  ingress:
  - name: "deny-all-ingress-from-slytherin"
    action: "Deny"
    from:
    - pods:
        namespaceSelector:
          matchLabels:
            conformance-house: slytherin
        podSelector:
          matchLabels:
            conformance-house: slytherin
  egress:
  - name: "deny-all-egress-to-slytherin"
    action: "Deny"
    to:
    - pods:
        namespaceSelector:
          matchLabels:
            conformance-house: slytherin
        podSelector:
          matchLabels:
            conformance-house: slytherin
