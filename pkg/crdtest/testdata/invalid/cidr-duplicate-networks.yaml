# Invalid: duplicate CIDR entries in the same peer networks list.
apiVersion: policy.networking.k8s.io/v1alpha2
kind: ClusterNetworkPolicy
metadata:
  name: cidr-duplicate-networks
spec:
  tier: Admin
  priority: 10
  subject:
    namespaces:
      matchLabels:
        kubernetes.io/metadata.name: sensitive-ns
  egress:
    - action: Deny
      to:
        - networks:
            - "10.10.10.1/24"
            - "10.10.10.1/24"
