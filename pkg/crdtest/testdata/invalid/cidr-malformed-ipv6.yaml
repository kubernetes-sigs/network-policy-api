# Invalid: malformed IPv6 CIDR in networks peer.
apiVersion: policy.networking.k8s.io/v1alpha2
kind: ClusterNetworkPolicy
metadata:
  name: cidr-malformed-ipv6
spec:
  tier: Admin
  priority: 10
  subject:
    namespaces:
      matchLabels:
        kubernetes.io/metadata.name: sensitive-ns
  egress:
    - action: Deny
      to:
        - networks:
            - "2001:db8:a0b:12f0::::0:1/128"
